name: Build ESP32-S3 N16R8 NAT Router (Optimized)

on:
  workflow_dispatch:   # Jalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo ini
        uses: actions/checkout@v4

      - name: Clone esp32_nat_router
        run: |
          git clone --depth=1 https://github.com/martin-ger/esp32_nat_router.git
          echo "Clone selesai"

      - name: Terapkan sdkconfig optimasi N16R8
        run: |
          cp config/sdkconfig.defaults.esp32s3 esp32_nat_router/sdkconfig.defaults.esp32s3
          echo "sdkconfig diterapkan"

      - name: Setup ESP-IDF v5.3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: esp32_nat_router
          command: >
            idf.py
            -B build_s3
            -D "SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.esp32s3"
            build

      - name: Kumpulkan binary hasil build
        run: |
          mkdir -p output
          cp esp32_nat_router/build_s3/bootloader/bootloader.bin        output/
          cp esp32_nat_router/build_s3/partition_table/partition-table.bin output/
          cp esp32_nat_router/build_s3/ota_data_initial.bin              output/
          cp esp32_nat_router/build_s3/esp32_nat_router.bin              output/

          echo "=== Binary siap ==="
          ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32s3-n16r8-optimized
          path: output/
          retention-days: 7
